<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1921 Menu Guide</title>
<meta name="description" content="1921 Mount Dora — menu descriptions, allergens and sourcing for service staff.">

<!-- Home-screen icon + standalone app behavior -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1921 Menu">
<meta name="theme-color" content="#78918A">

<style>
  :root{
    --sage:#78918A;
    --sage-dk:#5E736D;
    --cream:#F7F4ED;
    --paper:#FFFFFF;
    --ink:#23282A;
    --ink-soft:#5C6567;
    --rule:#E2DDD2;
    --amber:#B3720C;
    --amber-bg:#FDF3DF;
    --alert:#A62B25;
    --alert-bg:#FBEBE9;
    --shadow:0 1px 2px rgba(35,40,42,.06), 0 6px 18px rgba(35,40,42,.05);
    --maxw:760px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --sage:#9DB4AD; --sage-dk:#B7C9C3;
      --cream:#16191A; --paper:#1E2224; --ink:#ECEAE4; --ink-soft:#A2ABAC;
      --rule:#2E3436;
      --amber:#E8B860; --amber-bg:#332A16;
      --alert:#F09189; --alert-bg:#3A1F1D;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    }
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- header ---------- */
  header{
    background:var(--sage); color:#fff;
    padding:calc(env(safe-area-inset-top) + 18px) 16px 14px;
    text-align:center;
  }
  header img{width:132px; height:auto; display:block; margin:0 auto 6px;
    filter:brightness(0) invert(1); opacity:.96}
  header .sub{font-size:11px; letter-spacing:.16em; text-transform:uppercase; opacity:.85}

  /* ---------- sticky controls ---------- */
  .controls{
    position:sticky; top:0; z-index:20;
    background:var(--cream);
    border-bottom:1px solid var(--rule);
    padding:10px 12px 8px;
  }
  .searchwrap{position:relative}
  #q{
    width:100%; padding:12px 38px 12px 14px; font-size:16px;
    border:1px solid var(--rule); border-radius:10px;
    background:var(--paper); color:var(--ink);
    -webkit-appearance:none; appearance:none;
  }
  #q:focus{outline:none; border-color:var(--sage); box-shadow:0 0 0 3px rgba(120,145,138,.18)}
  #clear{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    border:0; background:none; color:var(--ink-soft); font-size:20px;
    width:32px; height:32px; line-height:1; cursor:pointer; display:none;
  }
  .chiprow{display:flex; gap:8px; align-items:center; margin-top:8px}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; flex:1; min-width:0}
  .chips::-webkit-scrollbar{display:none}
  #quizBtn{
    flex:0 0 auto; padding:7px 15px; border-radius:999px; cursor:pointer;
    border:1px solid var(--sage); background:var(--sage); color:#fff;
    font-size:13px; font-weight:700; letter-spacing:.03em; white-space:nowrap;
  }
  @media (prefers-color-scheme: dark){ #quizBtn{color:#12191B} }
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; cursor:pointer;
    border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft);
    font-size:13px; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--sage); border-color:var(--sage); color:#fff; font-weight:600}
  @media (prefers-color-scheme: dark){ .chip[aria-pressed="true"]{color:#12191B} }

  /* ---------- list ---------- */
  main{max-width:var(--maxw); margin:0 auto; padding:12px 12px 60px}
  .status-line{font-size:12px; color:var(--ink-soft); text-align:center; padding:8px 4px 12px}
  .status-line b{color:var(--ink); font-weight:600}

  .section{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--sage-dk); font-weight:700;
    padding:22px 4px 8px; border-bottom:1px solid var(--rule); margin-bottom:10px;
  }
  .section .note{display:block; font-size:12px; letter-spacing:.01em; text-transform:none;
    font-weight:400; color:var(--ink-soft); margin-top:4px}
  .menuhead{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    color:#fff; background:var(--sage); border-radius:8px;
    padding:9px 12px; margin:26px 0 4px;
  }
  @media (prefers-color-scheme: dark){ .menuhead{color:#12191B} }
  .menuhead:first-child{margin-top:6px}
  .menuhead .note{display:block; font-size:11px; letter-spacing:.04em; text-transform:none; font-weight:400; opacity:.9; margin-top:2px}

  .card{
    background:var(--paper); border:1px solid var(--rule); border-radius:12px;
    margin:8px 0; box-shadow:var(--shadow); overflow:hidden;
  }
  .card.verify{border-left:4px solid var(--amber)}
  .cardhead{
    display:block; width:100%; text-align:left; background:none; border:0;
    padding:13px 14px; cursor:pointer; color:inherit; font:inherit;
  }
  .name{font-size:18px; font-weight:700; letter-spacing:-.01em; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
  .price{font-size:14px; font-weight:600; color:var(--ink-soft); white-space:nowrap}
  .line{font-size:13.5px; color:var(--ink-soft); margin-top:3px}
  .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
  .tag{font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:3px 8px; border-radius:5px; background:var(--alert-bg); color:var(--alert)}
  .tag.soft{background:var(--cream); color:var(--ink-soft); font-weight:600}
  .tag.verify{background:var(--amber-bg); color:var(--amber)}
  @media (prefers-color-scheme: dark){ .tag.soft{background:#262C2E} }

  .body{display:none; padding:0 14px 14px; border-top:1px solid var(--rule); margin-top:2px}
  .card.open .body{display:block}
  .card.open .cardhead{padding-bottom:10px}
  .field{margin-top:12px}
  .field h4{
    margin:0 0 3px; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--sage-dk); font-weight:700;
  }
  .field p{margin:0; font-size:15px; white-space:pre-wrap}
  .field.allerg p{font-weight:600}
  .field.allerg h4{color:var(--alert)}
  .updated{font-size:11px; color:var(--ink-soft); margin-top:14px; padding-top:8px; border-top:1px dashed var(--rule)}
  mark{background:rgba(255,214,102,.55); color:inherit; border-radius:2px; padding:0 1px}
  @media (prefers-color-scheme: dark){ mark{background:rgba(232,184,96,.32)} }

  .empty{text-align:center; color:var(--ink-soft); padding:44px 16px; font-size:15px}
  .err{background:var(--alert-bg); color:var(--alert); border-radius:10px; padding:14px; font-size:14px; margin:12px 0}
  .banner{
    background:var(--amber-bg); color:var(--amber); border-radius:10px;
    padding:11px 13px; font-size:13px; margin:0 0 10px; line-height:1.45;
  }
  footer{max-width:var(--maxw); margin:0 auto; padding:24px 16px 40px; text-align:center;
    font-size:11.5px; color:var(--ink-soft); line-height:1.7}
  footer a{color:var(--sage-dk)}

  /* ---------- quiz ---------- */
  #quiz{display:none; position:fixed; inset:0; z-index:50; background:var(--cream); overflow-y:auto}
  body.quizzing #quiz{display:block}
  body.quizzing .controls, body.quizzing main, body.quizzing footer, body.quizzing header{display:none}
  .qwrap{max-width:var(--maxw); margin:0 auto; padding:calc(env(safe-area-inset-top) + 16px) 16px 48px}
  .qtop{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:4px}
  .qtop .step{font-size:12px; color:var(--ink-soft); font-weight:600}
  .qtop button{
    border:1px solid var(--rule); background:var(--paper); color:var(--ink-soft);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
  }
  .bar{height:4px; background:var(--rule); border-radius:99px; overflow:hidden; margin:10px 0 20px}
  .bar i{display:block; height:100%; background:var(--sage); transition:width .25s}

  .qh{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--sage-dk);
    font-weight:700; margin:22px 0 8px}
  .qh:first-of-type{margin-top:6px}
  .qtitle{font-size:26px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px}
  .qlead{font-size:14.5px; color:var(--ink-soft); margin:0 0 4px; line-height:1.6}
  .opts{display:flex; flex-wrap:wrap; gap:8px}
  .opt{
    padding:11px 16px; border-radius:10px; border:1px solid var(--rule);
    background:var(--paper); color:var(--ink); font-size:15px; cursor:pointer; text-align:left;
  }
  .opt[aria-pressed="true"]{border-color:var(--sage); background:var(--sage); color:#fff; font-weight:600}
  @media (prefers-color-scheme: dark){ .opt[aria-pressed="true"]{color:#12191B} }
  .opts.stack{flex-direction:column}
  .opts.stack .opt{width:100%}

  .qprompt{font-size:20px; font-weight:700; line-height:1.4; margin:0 0 4px}
  .qsub{font-size:14px; color:var(--ink-soft); margin:0 0 16px; line-height:1.6}
  .qsub b{color:var(--ink)}
  .qhint{font-size:12px; color:var(--ink-soft); margin:-8px 0 14px; font-style:italic}

  .opt.correct{border-color:#2E7D53; background:#E6F4EC; color:#1B5236; font-weight:600}
  .opt.wrong{border-color:var(--alert); background:var(--alert-bg); color:var(--alert); font-weight:600}
  .opt.missed{border-color:#2E7D53; border-style:dashed; color:#2E7D53}
  @media (prefers-color-scheme: dark){
    .opt.correct{background:#173226; color:#8FD3AC; border-color:#2E7D53}
    .opt.missed{color:#8FD3AC}
  }
  .opt[disabled]{cursor:default}

  .verdict{margin-top:18px; padding:14px; border-radius:10px; font-size:14.5px; line-height:1.6}
  .verdict.ok{background:#E6F4EC; color:#1B5236}
  .verdict.no{background:var(--alert-bg); color:var(--alert)}
  @media (prefers-color-scheme: dark){ .verdict.ok{background:#173226; color:#8FD3AC} }
  .verdict .src{display:block; margin-top:6px; font-size:12.5px; opacity:.85}

  .qbtn{
    display:block; width:100%; margin-top:20px; padding:15px; border:0; border-radius:11px;
    background:var(--sage); color:#fff; font-size:16px; font-weight:700; cursor:pointer;
  }
  @media (prefers-color-scheme: dark){ .qbtn{color:#12191B} }
  .qbtn.ghost{background:var(--paper); color:var(--ink-soft); border:1px solid var(--rule); font-weight:600; margin-top:10px}

  .score{text-align:center; padding:20px 0 6px}
  .score .big{font-size:56px; font-weight:800; letter-spacing:-.03em; line-height:1}
  .score .of{font-size:15px; color:var(--ink-soft); margin-top:6px}
  .score .verdictline{font-size:16px; margin-top:14px; font-weight:600}

  .review{margin-top:26px}
  .rev{background:var(--paper); border:1px solid var(--rule); border-left:4px solid var(--alert);
    border-radius:10px; padding:13px 14px; margin:10px 0}
  .rev .p{font-size:15px; font-weight:600; margin:0 0 6px}
  .rev .a{font-size:14px; margin:0; color:var(--ink-soft)}
  .rev .a b{color:#2E7D53}
  @media (prefers-color-scheme: dark){ .rev .a b{color:#8FD3AC} }
</style>

<body>

<header>
  <img src="logo.png" alt="1921 Mount Dora">
  <div class="sub">Menu Guide</div>
</header>

<div class="controls">
  <div class="searchwrap">
    <input id="q" type="search" placeholder="Search a dish, allergen or farm…"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="clear" aria-label="Clear search">&times;</button>
  </div>
  <div class="chiprow">
    <div class="chips" id="chips"></div>
    <button id="quizBtn">Quiz me</button>
  </div>
</div>

<main>
  <div class="banner">
    Never quote allergens off a <b>CHEF TO VERIFY</b> row. If it isn't confirmed, ask the kitchen.
  </div>
  <div id="out"><div class="empty">Loading…</div></div>
  <div class="status-line" id="stat"></div>
</main>

<footer>
  1921 Mount Dora — internal reference for service staff.<br>
  Edited by management in the Menu Descriptions sheet; this page follows it automatically.
</footer>

<div id="quiz"><div class="qwrap" id="qwrap"></div></div>

<script>
/* ============================================================
   CONFIG — the only part you ever need to edit.

   Paste the "Publish to web" CSV link for each Web Feed tab.
   File ▸ Share ▸ Publish to web ▸ pick the tab ▸ Comma-separated values (.csv)

   To add a list later (wine by the glass, cocktails, etc.):
   add another object here. Nothing else in this file changes.
   ============================================================ */
const FEEDS = [
  {
    key:  'dishes',
    type: 'dishes',
    // "Web Feed" tab
    url:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vTzVODK1d4z9T7W6pyhNITJGgsFNpgsR6BvJ7vw1fOLi-OEJ4Ughaboh2Wz00VxaHft9vaeIa6mRhYM/pub?gid=1684049218&single=true&output=csv'
  },
  {
    key:  'farms',
    type: 'farms',
    label:'Farms & Purveyors',
    // "Web Feed - Farms" tab
    url:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vTzVODK1d4z9T7W6pyhNITJGgsFNpgsR6BvJ7vw1fOLi-OEJ4Ughaboh2Wz00VxaHft9vaeIa6mRhYM/pub?gid=1269368794&single=true&output=csv'
  },
  {
    key:  'quizbank',
    type: 'quiz',
    // "Quiz Bank" tab — hand-written questions mixed into every quiz.
    // Leave as PASTE_ until the tab is published; the quiz works without it.
    url:  'https://docs.google.com/spreadsheets/d/e/2PACX-1vTzVODK1d4z9T7W6pyhNITJGgsFNpgsR6BvJ7vw1fOLi-OEJ4Ughaboh2Wz00VxaHft9vaeIa6mRhYM/pub?gid=1408546405&single=true&output=csv'
  }
];

/* Order the menu filters appear in. Anything not listed lands at the end. */
const MENU_ORDER = ['Dinner','Happy Hour','Dessert','Farms & Purveyors','Archive'];

/* ============================================================
   Nothing below here needs editing.
   ============================================================ */

const CACHE_KEY = 'menuguide.v1';
const $ = s => document.querySelector(s);
const out = $('#out'), stat = $('#stat'), qBox = $('#q');
let ROWS = [], QBANK = [], activeMenu = 'All', query = '';

/* ---------- RFC4180 CSV parser (handles quotes, commas, newlines) ---------- */
function parseCSV(text){
  const rows = []; let row = [], f = '', i = 0, inQ = false;
  text = text.replace(/^﻿/, '');
  while (i < text.length){
    const c = text[i];
    if (inQ){
      if (c === '"'){
        if (text[i+1] === '"'){ f += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      f += c; i++; continue;
    }
    if (c === '"'){ inQ = true; i++; continue; }
    if (c === ','){ row.push(f); f = ''; i++; continue; }
    if (c === '\r'){ i++; continue; }
    if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += c; i++;
  }
  if (f.length || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

/* ---------- allergen chips ---------- */
const ALLERGENS = [
  [/\bshellfish|shrimp|oyster|scallop|crab|lobster|cephalopod|octopus\b/i, 'Shellfish'],
  [/\bfish\b(?!\s*dip\b)|anchov|snapper|grouper|hamachi|wahoo/i,           'Fish'],
  [/\btree ?nut|nuts?\b|pecan|almond|pistachio|macadamia|hazelnut|cashew|walnut|pine ?nut|marcona/i, 'Tree Nuts'],
  [/\bpeanut/i,                     'Peanut'],
  [/\bgluten|wheat|barley|malt\b/i, 'Gluten'],
  [/\bdairy|milk|cheese|butter|cream\b/i, 'Dairy'],
  [/\begg\b|eggs\b|mayo/i,          'Egg'],
  [/\bsoy\b/i,                      'Soy'],
  [/\bsesame|benne/i,               'Sesame'],
  [/\bpork|bacon|ham\b|prosciutto/i,'Pork'],
  [/\bcoconut/i,                    'Coconut'],
  [/\bgelatin/i,                    'Gelatin'],
  [/\balcohol|bourbon|brandy|wine\b|cognac/i, 'Alcohol']
];
const ASK = /\bask kitchen|verify|varies|depends|confirm\b/i;

function chipsFor(text){
  if (!text || !text.trim()) return [];
  const hits = ALLERGENS.filter(([re]) => re.test(text)).map(([, name]) => name);
  if (ASK.test(text)) hits.push('Ask Kitchen');
  return [...new Set(hits)];
}

/* ---------- normalise a feed into row objects ---------- */
function ingest(feed, table){
  if (!table.length) return [];
  const head = table[0].map(h => h.trim().toLowerCase());
  const col = (...names) => {
    for (const n of names){
      const i = head.findIndex(h => h.includes(n));
      if (i > -1) return i;
    }
    return -1;
  };

  if (feed.type === 'quiz'){
    // Columns (by header name, any order): Menu · Question · Correct · Wrong 1 ·
    // Wrong 2 · Wrong 3 · Explanation · Item · Active
    // Several right answers → separate them with " | " in Correct (becomes check-all).
    const cM = col('menu'), cQ = col('question'), cC = col('correct'),
          cE = col('explan'), cI = col('item'), cA = col('active');
    const cW = head.map((h,i) => /^wrong/.test(h) ? i : -1).filter(i => i > -1);
    const g = (r,i) => (i > -1 ? (r[i]||'') : '').trim();
    return table.slice(1).map(r => ({
      menu:   g(r,cM) || 'All',
      prompt: g(r,cQ),
      correct:g(r,cC).split(/\s*\|\s*/).filter(Boolean),
      wrong:  cW.map(i => g(r,i)).filter(Boolean),
      source: g(r,cE),
      item:   g(r,cI),
      active: !/^(n|no|off|false|0)$/i.test(g(r,cA))
    })).filter(q => q.active && q.prompt && q.correct.length && q.wrong.length);
  }

  if (feed.type === 'farms'){
    const cF = col('farm','purveyor'), cL = col('location'), cW = col('what we get','talking');
    return table.slice(1).map(r => ({
      menu: feed.label || 'Farms & Purveyors',
      section: '',
      item: (r[cF]||'').trim(),
      line: (r[cL]||'').trim(),
      made: (r[cW]||'').trim(),
      defs:'', allerg:'', farm:'', status:'', updated:'',
      isHead:false, isRef:true
    })).filter(r => r.item);
  }

  const c = {
    menu:   col('menu'),
    item:   col('item'),
    line:   col('menu line','as printed'),
    made:   col("how it's made",'how its made','made'),
    defs:   col('definition'),
    allerg: col('allergen'),
    farm:   col('farm','sourcing'),
    status: col('status'),
    updated:col('updated')
  };

  return table.slice(1).map(r => {
    const g = k => (c[k] > -1 ? (r[c[k]] || '') : '').trim();
    const item = g('item');
    // A merged section banner exports as text in the Item cell with the rest blank.
    const rest = ['line','made','defs','allerg','farm','status','updated'].map(g).join('');
    return {
      menu: g('menu') || 'Menu',
      item, line: g('line'), made: g('made'), defs: g('defs'),
      allerg: g('allerg'), farm: g('farm'),
      status: g('status'), updated: g('updated'),
      isHead: !!item && !rest
    };
  }).filter(r => r.item);
}

/* carry section banners down onto the dishes beneath them */
function applySections(rows){
  let sec = '', secNote = '', menu = '';
  const outRows = [];
  for (const r of rows){
    if (r.menu !== menu){ menu = r.menu; sec = ''; secNote = ''; }
    if (r.isHead){
      // "DESSERTS — menu dated 8/17/26"  →  title + note
      const bits = r.item.split(/\s+—\s+/);
      sec = bits.shift().trim();
      secNote = bits.join(' — ').trim();
      continue;
    }
    r.section = sec; r.secNote = secNote;
    r.chips = chipsFor(r.allerg);
    r.verify = /verify|needs chef/i.test(r.status);
    r.archived = /archiv/i.test(r.status);
    if (r.archived) r.menu = 'Archive';
    r.hay = [r.item, r.line, r.made, r.defs, r.allerg, r.farm, r.section, r.menu]
              .join(' ').toLowerCase();
    // The printed menu line ends in the price, e.g. "… — 45" or "… — 3.5 each".
    // Pull it out as a badge and drop it from the line so it isn't shown twice.
    const m = r.line.match(/\s+—\s*\$?([\d.]+)(\s*each)?\s*$/i);
    if (m){
      r.price = '$' + m[1] + (m[2] ? ' ea' : '');
      r.line  = r.line.slice(0, m.index).trim();
    } else r.price = '';
    outRows.push(r);
  }
  return outRows;
}

/* ---------- fetch ---------- */
async function load(){
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached){
    try{
      const { rows, qbank, at } = JSON.parse(cached);
      ROWS = rows; QBANK = qbank || []; render(); setStatus(at, true);
    }catch(e){}
  }

  const unset = FEEDS.filter(f => /^PASTE_/.test(f.url));
  if (unset.length === FEEDS.length){
    out.innerHTML = '<div class="err"><b>Not connected yet.</b><br>' +
      'Open <code>index.html</code> and paste the published CSV links into the CONFIG block at the top.</div>';
    return;
  }

  try{
    const parts = await Promise.all(
      FEEDS.filter(f => !/^PASTE_/.test(f.url)).map(async f => {
        try{
          const res = await fetch(f.url + (f.url.includes('?') ? '&' : '?') + 'cb=' + Date.now());
          if (!res.ok) throw new Error(f.key + ' → HTTP ' + res.status);
          return { f, rows: ingest(f, parseCSV(await res.text())) };
        }catch(e){
          if (f.type === 'quiz') return { f, rows: QBANK };  // bank failing never blocks the guide
          throw e;
        }
      })
    );
    ROWS  = applySections(parts.filter(p => p.f.type !== 'quiz').flatMap(p => p.rows));
    QBANK = parts.filter(p => p.f.type === 'quiz').flatMap(p => p.rows);
    const at = Date.now();
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: ROWS, qbank: QBANK, at })); }catch(e){}
    render(); setStatus(at, false);
  }catch(err){
    if (!ROWS.length){
      out.innerHTML = '<div class="err"><b>Couldn\'t load the menu.</b><br>' +
        'Check your signal and pull down to refresh.<br><small>' + err.message + '</small></div>';
    }else{
      stat.innerHTML = 'Showing your last saved copy — couldn\'t reach the sheet just now.';
    }
  }
}

function setStatus(at, fromCache){
  const d = new Date(at);
  const when = d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ', ' +
               d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

  // Newest date in the sheet's own "Updated" column = how current the content is,
  // as opposed to when this phone last downloaded it.
  let newest = 0, label = '';
  for (const r of ROWS){
    const m = (r.updated||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (!m) continue;
    const yr = +m[3] < 100 ? 2000 + +m[3] : +m[3];
    const t = new Date(yr, +m[1]-1, +m[2]).getTime();
    if (t > newest){ newest = t; label = r.updated; }
  }

  stat.innerHTML =
    (label ? 'Menus current as of <b>' + esc(label) + '</b> · ' : '') +
    ROWS.filter(r => !r.archived && !r.isRef).length + ' items<br>' +
    '<span style="opacity:.8">' + (fromCache ? 'saved copy from ' : 'downloaded ') + when + '</span>';
}

/* ---------- render ---------- */
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(s){
  s = esc(s);
  if (!query) return s;
  const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig');
  return s.replace(re, '<mark>$1</mark>');
}

function buildChips(){
  const menus = [...new Set(ROWS.map(r => r.menu))]
    .sort((a,b) => {
      const ia = MENU_ORDER.indexOf(a), ib = MENU_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
  const all = ['All', ...menus];
  const on = query ? 'All' : activeMenu;
  $('#chips').innerHTML = all.map(m =>
    `<button class="chip" data-m="${esc(m)}" aria-pressed="${m===on}">${esc(m)}</button>`
  ).join('');
}

function render(){
  buildChips();
  let rows = ROWS;
  if (query){
    rows = ROWS.filter(r => r.hay.includes(query));   // search spans everything
  } else if (activeMenu !== 'All'){
    rows = rows.filter(r => r.menu === activeMenu);
  } else {
    rows = rows.filter(r => !r.archived && !r.isRef); // All = what's on tonight
  }

  if (!rows.length){
    out.innerHTML = '<div class="empty">Nothing matches <b>' + esc(qBox.value) + '</b>.' +
      '<br><br>Try a farm name, an allergen, or part of the dish.</div>';
    return;
  }

  let html = '', lastMenu = null, lastSec = null;
  for (const r of rows){
    if (r.menu !== lastMenu){
      lastMenu = r.menu; lastSec = null;
      const note = r.menu === 'Archive'
        ? '<span class="note">Off the menu — kept for when these come back around.</span>' : '';
      html += `<div class="menuhead">${esc(r.menu)}${note}</div>`;
    }
    if (r.section && r.section !== lastSec){
      lastSec = r.section;
      html += `<div class="section">${esc(r.section)}` +
              (r.secNote ? `<span class="note">${esc(r.secNote)}</span>` : '') + `</div>`;
    }
    html += card(r);
  }
  out.innerHTML = html;
}

function card(r){
  const tags = [];
  if (r.verify) tags.push('<span class="tag verify">Chef to verify</span>');
  r.chips.forEach(c => tags.push(
    `<span class="tag${c === 'Ask Kitchen' ? ' soft' : ''}">${esc(c)}</span>`));

  const f = (label, val, cls) => val && val.trim()
    ? `<div class="field ${cls||''}"><h4>${label}</h4><p>${hl(val)}</p></div>` : '';

  return `<div class="card${r.verify ? ' verify' : ''}">
    <button class="cardhead">
      <div class="name">${hl(r.item)}${r.price ? `<span class="price">${esc(r.price)}</span>` : ''}</div>
      ${r.line ? `<div class="line">${hl(r.line)}</div>` : ''}
      ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    </button>
    <div class="body">
      ${f("How it's made & notes", r.made)}
      ${f('Allergens', r.allerg, 'allerg')}
      ${f('Worth knowing', r.defs)}
      ${f('Farm / sourcing', r.farm)}
      ${r.updated ? `<div class="updated">Sheet updated ${esc(r.updated)}${r.status ? ' · ' + esc(r.status) : ''}</div>` : ''}
    </div>
  </div>`;
}

/* ============================================================
   QUIZ
   Questions are generated from the sheet itself, so they stay
   correct as the menus change. Rules:
     - CHEF TO VERIFY rows are skipped entirely
     - archived dishes are never quizzed
     - wrong answers are drawn from the same pool, so they're
       plausible rather than obviously silly
   ============================================================ */

const qw = $('#qwrap');
let QUIZ = null;

const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]];} return a; };
const pick  = a => a[(Math.random()*a.length)|0];
const sample= (a,n) => shuffle(a).slice(0,n);

/* A Definitions cell can hold several "Term: meaning." pairs. Split them. */
function parseDefs(cell){
  if (!cell) return [];
  const re = /([A-ZÉÀ][A-Za-zÀ-ÿ'’\- ]{1,38}?):\s+/g;
  const marks = [];
  let m; while ((m = re.exec(cell))) marks.push({ term: m[1].trim(), from: m.index, to: re.lastIndex });
  if (!marks.length) return [];
  return marks.map((mk, i) => ({
    term: mk.term,
    def : cell.slice(mk.to, i+1 < marks.length ? marks[i+1].from : cell.length).trim().replace(/\s+/g,' ')
  })).filter(d => d.term.length > 2 && d.def.length > 12);
}

/* eligible rows for a given scope */
function quizPool(scope){
  return ROWS.filter(r => {
    if (r.archived || r.verify) return false;         // never quiz unverified or off-menu
    if (scope === 'All')   return true;
    return r.menu === scope;
  });
}

const ALL_ALLERGEN_NAMES = ALLERGENS.map(a => a[1]);

/* ---- question builders. each returns null if it can't make a fair one ---- */

function qAllergen(pool){
  const cands = pool.filter(r => !r.isRef && r.chips.length && !r.chips.includes('Ask Kitchen'));
  if (cands.length < 2) return null;
  const r = pick(cands);
  const right = r.chips.filter(c => c !== 'Ask Kitchen');
  const wrong = sample(ALL_ALLERGEN_NAMES.filter(a => !right.includes(a)), Math.max(2, 6 - right.length));
  if (!right.length || !wrong.length) return null;
  return {
    type:'Allergens',
    prompt:'Which of these are in the ' + r.item + '?',
    sub:r.line,
    hint:'Check all that apply.',
    options: shuffle([...right, ...wrong]),
    correct: right,
    multi:true,
    source:'Sheet says: ' + (r.allerg || '—')
  };
}

function qDefinition(pool){
  const defs = [];
  pool.forEach(r => parseDefs(r.defs).forEach(d => defs.push({ ...d, item:r.item })));
  const uniq = [];
  defs.forEach(d => { if (!uniq.some(u => u.term.toLowerCase() === d.term.toLowerCase())) uniq.push(d); });
  if (uniq.length < 4) return null;
  const r = pick(uniq);
  const wrong = sample(uniq.filter(u => u.term !== r.term), 3).map(u => u.def);
  return {
    type:'Definitions',
    prompt:'A guest asks what ' + r.term.toLowerCase() + ' is. What do you tell them?',
    sub:'',
    options: shuffle([r.def, ...wrong]),
    correct:[r.def],
    multi:false,
    stack:true,
    source:'On the ' + r.item + '.'
  };
}

function qFarmDish(pool){
  const cands = pool.filter(r => !r.isRef && r.farm && r.farm.length > 6 && !/confirm|rotating|see /i.test(r.farm));
  const others = ROWS.filter(r => !r.isRef && r.farm && r.farm.length > 6);
  if (cands.length < 1 || others.length < 4) return null;
  const r = pick(cands);
  const wrong = sample(others.filter(o => o.farm !== r.farm).map(o => o.farm), 3);
  if (wrong.length < 3) return null;
  return {
    type:'Sourcing',
    prompt:'Where does the ' + r.item + ' come from?',
    sub:r.line,
    options: shuffle([r.farm, ...wrong]),
    correct:[r.farm],
    multi:false,
    stack:true,
    source:'From the ' + r.menu + ' menu.'
  };
}

function qFarmWhat(pool){
  // Skip farms whose line is just "Produce" — several say the same thing,
  // which makes for an unfair question.
  const farms = ROWS.filter(r => r.isRef && r.made && r.made.length > 12
                            && !/^(local\s+)?produce\.?$/i.test(r.made.trim()));
  if (farms.length < 4) return null;
  const r = pick(farms);
  const wrong = sample(farms.filter(f => f.item !== r.item).map(f => f.made), 3);
  const askLocation = Math.random() < 0.35 && r.line && !/confirm|program/i.test(r.line);
  if (askLocation){
    const locs = [...new Set(farms.map(f => f.line).filter(l => l && !/confirm|program/i.test(l)))];
    if (locs.length < 4) return null;
    return {
      type:'Sourcing',
      prompt:'Where is ' + r.item + '?',
      sub:'', options: shuffle([r.line, ...sample(locs.filter(l => l !== r.line), 3)]),
      correct:[r.line], multi:false, stack:true,
      source:'We get: ' + r.made
    };
  }
  return {
    type:'Sourcing',
    prompt:'What do we get from ' + r.item + '?',
    sub:'', options: shuffle([r.made, ...wrong]),
    correct:[r.made], multi:false, stack:true,
    source:r.line ? r.item + ' — ' + r.line : ''
  };
}

function qNameDish(pool){
  const cands = pool.filter(r => !r.isRef && r.made && r.made.length > 55);
  if (cands.length < 4) return null;
  const r = pick(cands);
  // scrub the dish's own name out of the description so it isn't a giveaway
  let text = r.made;
  r.item.split(/[\s&]+/).filter(w => w.length > 3).forEach(w => {
    text = text.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'ig'), '—');
  });
  text = text.split(/(?<=[.!?])\s+/).slice(0, 2).join(' ');
  const wrong = sample(pool.filter(o => !o.isRef && o.item !== r.item).map(o => o.item), 3);
  if (wrong.length < 3) return null;
  return {
    type:'Name the dish',
    prompt:'Which dish is this?',
    sub:text,
    options: shuffle([r.item, ...wrong]),
    correct:[r.item],
    multi:false,
    stack:true,
    source:r.line
  };
}

/* Same dish on two menus (Burger on Dinner AND Happy Hour at a different
   price) must count as both. Match on item name or on the printed line
   (price is already stripped off r.line). */
const normName = t => (t||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function menusFor(r){
  const menus = ['Dinner','Happy Hour','Dessert'];
  const hits = ROWS.filter(o => !o.isRef && !o.archived && menus.includes(o.menu) &&
    (normName(o.item) === normName(r.item) || (r.line && normName(o.line) === normName(r.line))));
  return { menus: menus.filter(m => hits.some(h => h.menu === m)), hits };
}

function qWhichMenu(pool){
  const menus = ['Dinner','Happy Hour','Dessert'];
  const cands = ROWS.filter(r => !r.isRef && !r.archived && !r.verify && menus.includes(r.menu));
  if (cands.length < 4) return null;
  const r = pick(cands);
  const { menus: on, hits } = menusFor(r);
  const src = hits.length > 1
    ? hits.map(h => h.menu + (h.price ? ' ' + h.price : '')).join(' · ')
    : r.line;
  return {
    type:'Menus',
    prompt:'Which menu is the ' + r.item + ' on?',
    sub:'',
    hint:'Check all that apply.',
    options: menus,
    correct: on,
    multi:true,
    source: src
  };
}

/* ---- hand-written questions from the Quiz Bank tab ----
   Menu = All/blank → shows up in any quiz; otherwise only that scope.
   Item filled → the question disappears automatically while that dish is
   CHEF TO VERIFY or off the menu, same rule as the generated questions. */
function bankPool(scope){
  return QBANK.filter(q => {
    if (!(q.menu === 'All' || scope === 'All' || q.menu === scope)) return false;
    if (!q.item) return true;
    return ROWS.some(r => !r.isRef && !r.archived && !r.verify && normName(r.item) === normName(q.item));
  });
}
function bankQuestion(q){
  const opts = shuffle([...new Set([...q.correct, ...q.wrong])]);
  return {
    type:'House',
    prompt:q.prompt,
    sub:'',
    hint: q.correct.length > 1 ? 'Check all that apply.' : '',
    options: opts,
    correct: q.correct,
    multi: q.correct.length > 1,
    stack: opts.some(o => o.length > 18),
    source: q.source
  };
}

/* Which builders apply depends on the scope. Asking "what do we get from
   Alan Benton?" inside a Dinner quiz is off-topic, and "which menu is this
   on?" is a freebie once you've already picked a menu. */
function buildersFor(scope){
  if (scope === 'Farms & Purveyors') return [[qFarmWhat, 1]];
  const base = [[qAllergen, 3], [qDefinition, 3], [qNameDish, 3], [qFarmDish, 2]];
  if (scope === 'All') return [...base, [qFarmWhat, 1], [qWhichMenu, 1]];
  return base;
}

function buildQuiz(scope, n){
  const pool = quizPool(scope);
  const out = [], seen = new Set();

  // At least one Quiz Bank question per 10 asked (5→1, 10→1, 20→2, 30→3).
  const bank = shuffle(bankPool(scope));
  const floor = Math.min(bank.length, Math.ceil(n / 10));
  bank.slice(0, floor).forEach(b => {
    const q = bankQuestion(b);
    seen.add(q.prompt + '||' + q.correct.join(','));
    out.push(q);
  });
  // The rest of the bank stays in the random draw alongside the generators.
  const rest = bank.slice(floor);
  const qBank = () => rest.length ? bankQuestion(pick(rest)) : null;

  const weighted = [];
  const builders = buildersFor(scope);
  if (rest.length) builders.push([qBank, 2]);
  builders.forEach(([fn, w]) => { for (let i=0;i<w;i++) weighted.push(fn); });
  let guard = 0;
  while (out.length < n && guard++ < n * 80){
    const q = pick(weighted)(pool);
    if (!q) continue;
    if (new Set(q.options).size !== q.options.length) continue;   // no duplicate choices
    // Some prompts are constant ("Which dish is this?"), so the answer has to
    // be part of the key or only one of them ever makes it into a quiz.
    const key = q.prompt + '||' + q.correct.join(',');
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(q);
  }
  return shuffle(out);   // so the guaranteed bank questions aren't always first
}

/* ---- screens ---- */
function quizHome(){
  const scopes = ['All', ...MENU_ORDER.filter(m => m !== 'Archive' && ROWS.some(r => r.menu === m))];
  qw.innerHTML = `
    <div class="qtop"><span class="step">Study mode</span><button id="qx">Close</button></div>
    <h1 class="qtitle">Quiz me</h1>
    <p class="qlead">Questions are built from the menu guide itself, so they're always current.
       Anything the kitchen hasn't confirmed is left out.</p>
    <div class="qh">How many questions</div>
    <div class="opts" id="qn">
      ${[5,10,20,30].map((n,i)=>`<button class="opt" data-n="${n}" aria-pressed="${i===1}">${n}</button>`).join('')}
    </div>
    <div class="qh">What to study</div>
    <div class="opts" id="qs">
      ${scopes.map((s,i)=>`<button class="opt" data-s="${esc(s)}" aria-pressed="${i===0}">${esc(s)}</button>`).join('')}
    </div>
    <button class="qbtn" id="qgo">Start</button>`;
  const one = (wrap, sel) => {
    $(wrap).addEventListener('click', e => {
      const b = e.target.closest('.opt'); if (!b) return;
      [...$(wrap).children].forEach(c => c.setAttribute('aria-pressed', c === b));
    });
  };
  one('#qn'); one('#qs');
  $('#qx').onclick = closeQuiz;
  $('#qgo').onclick = () => {
    const n = +$('#qn [aria-pressed="true"]').dataset.n;
    const s = $('#qs [aria-pressed="true"]').dataset.s;
    const qs = buildQuiz(s, n);
    if (qs.length < 3){
      alert('Not enough confirmed material in "' + s + '" to build a quiz yet. Try All.');
      return;
    }
    QUIZ = { qs, i:0, score:0, scope:s, asked:n, misses:[], answered:false, picked:[] };
    renderQ();
  };
}

function renderQ(){
  const { qs, i } = QUIZ;
  const q = qs[i];
  QUIZ.answered = false; QUIZ.picked = [];
  qw.innerHTML = `
    <div class="qtop">
      <span class="step">${i+1} of ${qs.length} · ${esc(q.type)}</span>
      <button id="qx">Quit</button>
    </div>
    <div class="bar"><i style="width:${(i/qs.length)*100}%"></i></div>
    <p class="qprompt">${esc(q.prompt)}</p>
    ${q.sub ? `<p class="qsub">${esc(q.sub)}</p>` : ''}
    ${q.hint ? `<p class="qhint">${esc(q.hint)}</p>` : ''}
    <div class="opts ${q.stack||q.multi ? 'stack':''}" id="qo">
      ${q.options.map(o=>`<button class="opt" data-v="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join('')}
    </div>
    <div id="qafter"></div>
    <button class="qbtn" id="qsub">${q.multi ? 'Check answers' : 'Skip'}</button>`;
  $('#qx').onclick = closeQuiz;
  $('#qo').addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (!b || QUIZ.answered) return;
    if (q.multi){
      b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    } else {
      QUIZ.picked = [b.dataset.v]; grade();
    }
  });
  $('#qsub').onclick = () => {
    if (QUIZ.answered) return next();
    if (q.multi){ QUIZ.picked = [...qw.querySelectorAll('#qo .opt[aria-pressed="true"]')].map(b=>b.dataset.v); grade(); }
    else { QUIZ.picked = []; grade(); }
  };
}

function grade(){
  const q = QUIZ.qs[QUIZ.i];
  const picked = QUIZ.picked;
  const right = q.correct.length === picked.length && q.correct.every(c => picked.includes(c));
  QUIZ.answered = true;
  if (right) QUIZ.score++; else QUIZ.misses.push({ q, picked });

  qw.querySelectorAll('#qo .opt').forEach(b => {
    b.disabled = true;
    b.setAttribute('aria-pressed','false');
    const isRight = q.correct.includes(b.dataset.v);
    const wasPicked = picked.includes(b.dataset.v);
    if (isRight && wasPicked) b.classList.add('correct');
    else if (isRight)         b.classList.add('missed');
    else if (wasPicked)       b.classList.add('wrong');
  });

  $('#qafter').innerHTML = `<div class="verdict ${right?'ok':'no'}">
    ${right ? 'Right.' : (picked.length ? 'Not quite.' : 'Skipped.')}
    ${right ? '' : ' The answer is <b>' + q.correct.map(esc).join('</b>, <b>') + '</b>.'}
    ${q.source ? `<span class="src">${esc(q.source)}</span>` : ''}
  </div>`;
  const btn = $('#qsub');
  btn.textContent = QUIZ.i + 1 < QUIZ.qs.length ? 'Next question' : 'See how you did';
  btn.scrollIntoView({ block:'nearest' });
}

function next(){
  QUIZ.i++;
  if (QUIZ.i >= QUIZ.qs.length) results(); else renderQ();
}

function results(){
  const { score, qs, scope, misses } = QUIZ;
  const pct = Math.round(score / qs.length * 100);
  const line = pct === 100 ? 'Perfect. Go teach somebody.'
             : pct >= 85  ? 'Strong. You can work the floor on this.'
             : pct >= 70  ? 'Solid, with a few gaps to close.'
             : pct >= 50  ? 'Worth another pass before service.'
             : 'Read through the guide, then come back.';
  qw.innerHTML = `
    <div class="qtop"><span class="step">${esc(scope)} · ${qs.length} questions</span><button id="qx">Close</button></div>
    <div class="score">
      <div class="big">${pct}%</div>
      <div class="of">${score} of ${qs.length} correct</div>
      <div class="verdictline">${line}</div>
      ${QUIZ.asked > qs.length ? `<div class="of" style="margin-top:10px">
        You asked for ${QUIZ.asked}. ${esc(scope)} only has enough confirmed material
        for ${qs.length} fair questions right now.</div>` : ''}
    </div>
    <button class="qbtn" id="qshare">Share my score</button>
    <button class="qbtn ghost" id="qagain">Another quiz</button>
    <button class="qbtn ghost" id="qback">Back to the guide</button>
    ${misses.length ? `<div class="review"><div class="qh">What to look at again</div>
      ${misses.map(m=>`<div class="rev">
        <p class="p">${esc(m.q.prompt)}</p>
        <p class="a">Answer: <b>${m.q.correct.map(esc).join(', ')}</b>${
          m.picked.length ? ' · you said ' + m.picked.map(esc).join(', ') : ' · skipped'}</p>
      </div>`).join('')}</div>` : ''}`;
  $('#qx').onclick = $('#qback').onclick = closeQuiz;
  $('#qagain').onclick = quizHome;
  $('#qshare').onclick = async () => {
    const txt = `1921 menu quiz — ${scope}: ${score}/${qs.length} (${pct}%)`
      + (misses.length ? `\nMissed: ${misses.map(m=>m.q.prompt).join(' | ')}` : '\nNo misses.');
    try{
      if (navigator.share) await navigator.share({ text: txt });
      else { await navigator.clipboard.writeText(txt); $('#qshare').textContent = 'Copied — paste it to your manager'; }
    }catch(e){}
  };
  window.scrollTo({ top:0 });
}

function closeQuiz(){ document.body.classList.remove('quizzing'); QUIZ = null; qw.innerHTML=''; }
$('#quizBtn').onclick = () => {
  if (!ROWS.length) return;
  document.body.classList.add('quizzing');
  window.scrollTo({ top:0 });
  quizHome();
};

load();
</script>
</body>
</html>
